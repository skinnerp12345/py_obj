# EXAMPLE CONFIG -- single-purpose: run_matching.py only.
#
# Functions like a namelist familiar from NWP models (WRF, MPAS): one flat
# set of named parameters, no code changes needed to adjust a run. This file
# demonstrates ONLY the `matching:` section -- the one section
# run_matching.py's run_one_case() actually reads (see
# require_section(cfg.matching, ...) in python_obj/drivers/run_matching.py).
#
# Reads two pre-existing object-file directories (from any source, any
# driver) -- points here at output/obj_mrms and output/obj_model_ensemble,
# e.g. config_example_identify_track_mrms.yaml's and
# config_example_identify_track_model.yaml's own output directories. Run
# those two drivers first, or point truth_object_dir/forecast_object_dir at
# your own already-identified object files.
#
# Run with:
#   /opt/anaconda3/envs/pysteps_env/bin/python python_obj/drivers/run_matching.py python_obj/configs/config_example_run_matching.yaml

matching:
  truth_object_dir: output/obj_mrms              # e.g. config_example_identify_track_mrms.yaml's own output
  forecast_object_dir: output/obj_model_ensemble  # e.g. config_example_identify_track_model.yaml's own output
  output_dir: output/matches
  file_pattern: "*.nc"
  max_boundary_disp_km: 40.0
  max_centroid_disp_km: 40.0
  ti_threshold: 0.2
  max_time_offset_minutes: 5.0  # max allowed truth/forecast valid_time mismatch when pairing files
