[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py_obj"
version = "0.1.0"
description = "Object-based thunderstorm verification library: identification, tracking, and matching via Total Interest score."
requires-python = ">=3.10"

# Maps the importable package name "py_obj" to this repo's own root
# directory -- needed because the package root and the project/repo root
# are the same directory (a flat layout setuptools can't auto-discover
# without an explicit hint), not because of any folder-naming mismatch.
# `pip install -e .` is optional for in-repo use (plain sys.path insertion
# of this checkout's parent directory already makes `import py_obj` work,
# since the folder name matches the import name); it's mainly useful for
# using this library from a script or notebook outside the repo.
[tool.setuptools]
package-dir = {"py_obj" = "."}
packages = [
    "py_obj",
    "py_obj.obj_core",
    "py_obj.regrid",
    "py_obj.drivers",
    "py_obj.histogram",
]
